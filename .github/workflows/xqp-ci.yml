name: XQP CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'reference/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/xqp-ci.yml'
  pull_request:
    paths:
      - 'reference/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - '.github/workflows/xqp-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Runner probe
        shell: pwsh
        run: |
          Write-Output "runner=$env:RUNNER_NAME"
          node --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run protocol and transport tests
        run: npm test

      - name: Verify canonical XQP mint from finalized mainnet state
        run: npm run verify:mint

      - name: Execute full Solana devnet XQP lifecycle
        run: npm run test:devnet

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xqp-verification-evidence
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
