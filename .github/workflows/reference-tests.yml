name: XQP Reference Tests

on:
  push:
    paths:
      - 'reference/**'
      - 'schemas/**'
      - 'docs/XQP-0003-TRANSACTION-PROTOCOL.md'
      - '.github/workflows/reference-tests.yml'
  pull_request:
    paths:
      - 'reference/**'
      - 'schemas/**'
      - 'docs/XQP-0003-TRANSACTION-PROTOCOL.md'
      - '.github/workflows/reference-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run reference tests
        run: node --test reference/xqp_transaction.test.js