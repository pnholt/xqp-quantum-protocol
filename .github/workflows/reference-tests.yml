name: XQP Reference Tests

on:
  push:
    paths:
      - 'reference/**'
      - 'schemas/**'
      - 'docs/XQP-0003-TRANSACTION-PROTOCOL.md'
      - 'docs/XQP-0005-DEVNET-SETTLEMENT.md'
      - '.github/workflows/reference-tests.yml'
  pull_request:
    paths:
      - 'reference/**'
      - 'schemas/**'
      - 'docs/XQP-0003-TRANSACTION-PROTOCOL.md'
      - 'docs/XQP-0005-DEVNET-SETTLEMENT.md'
      - '.github/workflows/reference-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Node version
        run: node --version
      - name: Run reference tests
        run: node --test reference/*.test.js
