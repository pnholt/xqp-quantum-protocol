name: XQP Reference Runner Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: |
          echo "runner=$RUNNER_NAME"
          uname -a
          node --version

  reference-tests:
    needs: runner-probe
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run dependency-free reference tests
        run: node --test reference/xqp_transaction.test.js reference/solana_devnet_adapter.test.js
