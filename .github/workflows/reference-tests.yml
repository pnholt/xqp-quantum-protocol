name: XQP Reference Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'reference/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'docs/XQP-0003-TRANSACTION-PROTOCOL.md'
      - 'docs/XQP-0005-DEVNET-SETTLEMENT.md'
      - '.github/workflows/reference-tests.yml'
  pull_request:
    paths:
      - 'reference/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'docs/XQP-0003-TRANSACTION-PROTOCOL.md'
      - 'docs/XQP-0005-DEVNET-SETTLEMENT.md'
      - '.github/workflows/reference-tests.yml'

permissions:
  contents: read

jobs:
  runner-probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Runner identity
        run: |
          echo "runner=$RUNNER_NAME"
          uname -a
          node --version

  test:
    needs: runner-probe
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run reference tests
        run: node --test reference/*.test.js
